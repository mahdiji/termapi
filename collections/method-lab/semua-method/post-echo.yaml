id: post-echo
name: POST echo (json body)
method: POST
url: http://localhost:8084/api/echo
headers_list:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Request-Id
      value: req-post-002
body_spec:
    type: json
    raw: |-
        {
          "userId": "{{user.id}}",
          "item": "Laptop",
          "amount": 15000
        }
auth:
    type: none
    add_to: header
